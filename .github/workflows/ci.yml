name: CI

# Runs the same checks used before every pull request: syntax checks for every script and the full test
# suite, on every Node release line from the oldest supported version (package.json "engines") to the newest.
# Node 26 is the version this Mac runs. Node 20 reached end-of-life in April 2026 and was dropped.
#
# Runs on macOS because Public Desk is a Mac app: zsh and lsof (used by the launchers and the process-ownership
# tests) are built in, so the job downloads no packages, and the launchers are checked on the system they run on.
# On Ubuntu the job had to install zsh first, and a runner DNS outage on 2026-11-11 blocked CI for over an hour.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check JavaScript
        run: for file in server.mjs public/*.js public/app/*.js scripts/*.mjs; do node --check "$file"; done
      - name: Syntax-check Python
        run: python3 -m py_compile scripts/*.py
      - name: Syntax-check the Mac launchers
        run: |
          zsh -n "Start Public Desk.command"
          zsh -n "Stop Public Desk.command"
          zsh -n scripts/apply-open-osint-patches.zsh
          zsh -n scripts/service-ownership.zsh
          zsh -n scripts/setup-local.zsh
      - name: Run tests
        # The browser tests drive the Google Chrome that GitHub's macOS machines come with; fail if it is missing.
        env:
          PUBLIC_DESK_REQUIRE_BROWSER: '1'
        run: npm test
